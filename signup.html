<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BugTrack — Sign Up</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-page">
  <div class="window login-window">
    <div class="window-titlebar">
      <div class="dots">
        <span class="dot red"></span>
        <span class="dot amber"></span>
        <span class="dot green"></span>
      </div>
      <span class="window-title">bugtrack — sign up</span>
    </div>

    <div class="window-body">
      <div class="login-badge">&lt;/&gt;</div>
      <div class="login-logo">BugTrack</div>
      <div class="login-heading">Create your account</div>
      <div class="login-subtitle">Start tracking bugs for your team</div>

      <p id="signupError" class="form-message error"></p>

      <form id="signupForm">
        <div class="form-field full">
          <label for="name">Full Name</label>
          <input type="text" id="name" required>
        </div>
        <div class="form-field full">
          <label for="designation">Designation</label>
          <input type="text" id="designation" placeholder="e.g. Developer, QA Tester">
        </div>
        <div class="form-field full">
          <label for="email">Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-field full">
          <label for="password">Password</label>
          <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Create Account</button>
      </form>

      <div class="login-hint">Already have an account? <a href="login.html" style="color: var(--accent);">Log In</a></div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
