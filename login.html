<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BugTrack — Log In</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-page">
  <div class="login-card">
    <div class="login-logo"><span class="bracket">&lt;/&gt;</span> BugTrack</div>
    <div class="login-heading">Welcome back</div>
    <div class="login-subtitle">Log in to continue</div>

    <p id="loginError" class="form-message error"></p>

    <form id="loginForm">
      <div class="form-field full">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-field full">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">Log In</button>
    </form>

    <div class="login-hint">demo@bugtrack.com / demo123</div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
