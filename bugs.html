<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BugTrack — All Bugs</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="logo"><span class="bracket">&lt;/&gt;</span> BugTrack</div>
    <nav>
      <div class="nav-group-label">Menu</div>
      <ul>
        <li><a href="index.html" class="nav-link">Dashboard</a></li>
        <li><a href="bugs.html" class="nav-link active">All Bugs</a></li>
        <li><a href="report-bug.html" class="nav-link">Report Bug</a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <div id="sidebarUser">Loading...</div>
      <button class="btn btn-secondary" onclick="logout()" style="margin-top:10px; width:100%; justify-content:center;">Log Out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div><h1>All Bugs</h1><div class="subtitle">Every bug in the database</div></div>
      <a href="report-bug.html" class="btn btn-primary">+ Report Bug</a>
    </div>

    <div class="window">
      <div class="window-titlebar">
        <div class="dots"><span class="dot red"></span><span class="dot amber"></span><span class="dot green"></span></div>
        <span class="window-title">bugtrack — all-bugs</span>
      </div>

      <div class="window-body">
        <div class="search-box">
          <span class="icon">⌕</span>
          <input type="text" id="searchInput" placeholder="Search bugs...">
        </div>

        <table class="bug-table">
          <thead>
            <tr><th>ID</th><th>Title</th><th>Severity</th><th>Status</th><th>Assignee</th><th>Action</th></tr>
          </thead>
          <tbody id="bugsTableBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
