<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BugTrack — Report Bug</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="logo"><span class="bracket">&lt;/&gt;</span> BugTrack</div>
    <nav>
      <div class="nav-group-label">Menu</div>
      <ul>
        <li><a href="index.html" class="nav-link">Dashboard</a></li>
        <li><a href="bugs.html" class="nav-link">All Bugs</a></li>
        <li><a href="report-bug.html" class="nav-link active">Report Bug</a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <div id="sidebarUser">Loading...</div>
      <button class="btn btn-secondary" onclick="logout()" style="margin-top:10px; width:100%; justify-content:center;">Log Out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar"><div><h1>Report a Bug</h1><div class="subtitle">Saved directly to the database</div></div></div>

    <div class="window">
      <div class="window-titlebar">
        <div class="dots"><span class="dot red"></span><span class="dot amber"></span><span class="dot green"></span></div>
        <span class="window-title">bugtrack — new-bug-form</span>
      </div>

      <div class="window-body">
        <p id="reportMessage" class="form-message"></p>

        <form id="reportForm">
          <div class="form-grid">
            <div class="form-field full">
              <label for="bugTitle">Bug Title</label>
              <input type="text" id="bugTitle" required>
            </div>

            <div class="form-field full">
              <label for="bugDescription">Description</label>
              <textarea id="bugDescription"></textarea>
            </div>

            <div class="form-field full">
              <label>Severity</label>
              <div class="severity-choices">
                <div class="severity-choice"><input type="radio" name="severity" id="sev-low"><label for="sev-low">Low</label></div>
                <div class="severity-choice"><input type="radio" name="severity" id="sev-medium" checked><label for="sev-medium">Medium</label></div>
                <div class="severity-choice"><input type="radio" name="severity" id="sev-high"><label for="sev-high">High</label></div>
                <div class="severity-choice"><input type="radio" name="severity" id="sev-critical"><label for="sev-critical">Critical</label></div>
              </div>
            </div>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Submit Bug Report</button>
            <a href="bugs.html" class="btn btn-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
