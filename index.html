<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BugTrack — Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="logo"><span class="bracket">&lt;/&gt;</span> BugTrack</div>
    <nav>
      <div class="nav-group-label">Menu</div>
      <ul>
        <li><a href="index.html" class="nav-link active">Dashboard</a></li>
        <li><a href="bugs.html" class="nav-link">All Bugs</a></li>
        <li><a href="report-bug.html" class="nav-link">Report Bug</a></li>
      </ul>
    </nav>
    <div class="sidebar-footer">
      <div id="sidebarUser">Loading...</div>
      <button class="btn btn-secondary" onclick="logout()" style="margin-top:10px; width:100%; justify-content:center;">Log Out</button>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>
        <h1>Dashboard</h1>
        <div class="subtitle">Overview of all bugs</div>
      </div>
      <a href="report-bug.html" class="btn btn-primary">+ Report Bug</a>
    </div>

    <div class="window">
      <div class="window-titlebar">
        <div class="dots"><span class="dot red"></span><span class="dot amber"></span><span class="dot green"></span></div>
        <span class="window-title">bugtrack — dashboard</span>
      </div>

      <div class="window-body">
        <div class="stats">
          <div class="stat-card critical"><div class="label">Open</div><div class="value" id="statOpen">0</div></div>
          <div class="stat-card progress"><div class="label">In Progress</div><div class="value" id="statProgress">0</div></div>
          <div class="stat-card resolved"><div class="label">Resolved</div><div class="value" id="statResolved">0</div></div>
          <div class="stat-card"><div class="label">Total</div><div class="value" id="statTotal">0</div></div>
        </div>

        <div class="section-heading">Recent Bugs</div>
        <table class="bug-table">
          <thead>
            <tr><th>ID</th><th>Title</th><th>Severity</th><th>Status</th></tr>
          </thead>
          <tbody id="recentBugsBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
